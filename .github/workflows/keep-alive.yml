# Supabase 무료 플랜은 약 1주일간 활동이 없으면 프로젝트를 일시정지합니다.
# 3일마다 DB를 한 번 조회해 활성 상태로 유지합니다. (Actions 탭에서 수동 실행도 가능)
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase database
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" config.js)
          KEY=$(grep -o "sb_publishable_[A-Za-z0-9_-]*" config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded: $code"
          test "$code" = "200"
